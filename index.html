<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>جزيرة الناجين</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: linear-gradient(#7cc8e8, #2a7fa8);
    font-family: system-ui, sans-serif;
    color: #fff;
  }
  h1 { font-size: 2.4rem; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  button {
    width: 220px; padding: 14px;
    font-size: 1.2rem; border: 0; border-radius: 14px;
    background: #e8c98a; color: #4a3519;
  }
</style>
</head>
<body>
  <h1>جزيرة الناجين</h1>
  <button>ابدأ اللعب</button>
  <button>متابعة</button>
  <button>الإعدادات</button>
</body>
</html>
